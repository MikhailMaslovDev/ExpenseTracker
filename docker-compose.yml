services:
  family-expense-db:
    image: postgres:16-alpine
    container_name: family-expense-db
    environment:
      POSTGRES_DB: family_expenses
      POSTGRES_USER: family_expenses
      POSTGRES_PASSWORD: family_expenses_dev
    ports:
      - "54329:5432"
    volumes:
      - family-expense-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_expenses -d family_expenses"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  family-expense-postgres-data:
